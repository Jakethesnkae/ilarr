<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ilarr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M11 9v14M16 9v14M21 9l-2 14' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f5f8; --surface: #ffffff; --surface-2: #eeeef3; --border: #e1e1e9;
  --text: #17171c; --muted: #6b6b7b; --accent: #6a4cff; --accent-ink: #ffffff;
  --ok: #1a9a5b; --warn: #c27a00; --bad: #d03b4a; --info: #2b6fe0;
  --shadow: 0 1px 2px rgba(20,20,40,.06), 0 8px 24px rgba(20,20,40,.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e13; --surface: #17171f; --surface-2: #20202b; --border: #2a2a37;
    --text: #ececf2; --muted: #9393a6; --accent: #8b74ff; --accent-ink: #0e0e13;
    --ok: #4cd68d; --warn: #f2b84b; --bad: #ff6b7a; --info: #6aa2ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e13; --surface: #17171f; --surface-2: #20202b; --border: #2a2a37;
  --text: #ececf2; --muted: #9393a6; --accent: #8b74ff; --accent-ink: #0e0e13;
  --ok: #4cd68d; --warn: #f2b84b; --bad: #ff6b7a; --info: #6aa2ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--border);
  background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand svg { width: 16px; height: 16px; stroke: var(--accent-ink); }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: var(--muted); font-weight: 500; }
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; background: var(--bad); color: #fff; border-radius: 99px; padding: 0 7px; min-width: 20px; text-align: center; }
.nav .count.info { background: var(--info); }
.side .foot { margin-top: auto; padding: 10px; color: var(--muted); font-size: 12.5px; display: grid; gap: 10px; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.pulse.busy { background: var(--warn); animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

main { padding: 28px clamp(16px, 3vw, 40px) 60px; min-width: 0; max-width: 1400px; width: 100%; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 17px; margin: 28px 0 10px; letter-spacing: -.01em; }
.spacer { flex: 1; }
.sub { color: var(--muted); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn svg { width: 16px; height: 16px; }
.btn[disabled] { opacity: .5; cursor: default; }
.search { position: relative; }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; color: var(--muted); }
.field { width: 100%; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--muted); }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; }
.card { position: relative; display: block; border-radius: var(--radius); overflow: hidden; background: var(--surface);
  box-shadow: var(--shadow); transition: transform .15s; }
.card:hover { transform: translateY(-3px); }
.poster { aspect-ratio: 2/3; background: linear-gradient(145deg, var(--surface-2), var(--border)); background-size: cover; background-position: center;
  display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
.card .meta { padding: 10px 12px 12px; }
.card .t { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.card .s { color: var(--muted); font-size: 12.5px; margin-top: 4px; display: flex; justify-content: space-between; }
.bar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 8px; display: flex; }
.bar b { background: var(--ok); } .bar i { background: var(--warn); }
.badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: rgba(10,10,15,.72); color: #fff; backdrop-filter: blur(6px); }
.badge.right { left: auto; right: 8px; background: var(--bad); }
.badge.off { background: rgba(10,10,15,.72); opacity: .8; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--muted); }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill.info { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 56px minmax(0,1fr) 150px 110px; gap: 14px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row.head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); }
.row .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.row .f { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .f small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; }
.row.wide { grid-template-columns: 44px minmax(0,1fr) 150px 110px; }
.thumb { width: 44px; aspect-ratio: 2/3; border-radius: 6px; background: var(--surface-2) center/cover; }

.hero { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); }
.hero .bg { position: absolute; inset: 0; background-size: cover; background-position: center 30%; filter: blur(2px) brightness(.5); transform: scale(1.04); }
.hero .in { position: relative; display: flex; gap: 24px; padding: 28px; align-items: flex-end; min-height: 260px;
  background: linear-gradient(to top, rgba(10,10,15,.88), rgba(10,10,15,.2)); color: #f4f4f8; }
.hero .p { width: 150px; flex: none; aspect-ratio: 2/3; border-radius: 10px; background: var(--surface-2) center/cover; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.hero h1 { color: #fff; }
.hero .desc { max-width: 70ch; color: #d9d9e4; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 8px 0 14px; }
.hero .pill { background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(6px); }
.hero .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.2); backdrop-filter: blur(6px); }
.hero .btn.primary { background: var(--accent); color: var(--accent-ink); border: 0; }
.hero .actions, .hero .tags { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .tags { margin: 10px 0 0; }

.day { margin: 22px 0 8px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.day small { color: var(--muted); font-weight: 400; }
.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.empty svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: .6; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat { padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 12.5px; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.kv:last-child { border: 0; } .kv .k { color: var(--muted); } .kv code { word-break: break-all; }

.modal { position: fixed; inset: 0; background: rgba(5,5,10,.6); backdrop-filter: blur(4px); display: grid; place-items: start center; padding: 8vh 16px; z-index: 20; }
.dialog { width: min(680px, 100%); max-height: 80vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.dialog .head { padding: 16px; border-bottom: 1px solid var(--border); }
.dialog .list { overflow: auto; }
.res { display: flex; gap: 14px; padding: 12px 16px; align-items: center; border-bottom: 1px solid var(--border); }
.res .thumb { width: 52px; } .res .i { flex: 1; min-width: 0; } .res .i b { display: block; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 30; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: 360px; }
.toast.err { background: var(--bad); color: #fff; }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: var(--radius); }
@keyframes sh { to { background-position: -200% 0; } }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; bottom: 0; top: auto; height: auto; width: 100%; flex-direction: row; padding: 6px; z-index: 10;
    border-right: 0; border-top: 1px solid var(--border); justify-content: space-around; }
  .brand, .side .foot { display: none; }
  .nav { display: flex; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 8px; position: relative; }
  .nav .count { position: absolute; top: 0; right: 0; margin: 0; }
  main { padding-bottom: 90px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .search { flex: 1 1 100%; }
  .row, .row.wide { grid-template-columns: 40px minmax(0,1fr) 92px; } .row .air { display: none; }
  .hero .in { flex-direction: column; align-items: flex-start; } .hero .p { width: 110px; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M7 4v16M12 4v16M17 4l-2 16"/></svg></i> ilarr</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main id="view"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
const ICONS = {
  grid: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
  dl: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.6l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',
  play: '<path d="M7 4l13 8-13 8z"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  empty: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 12h8"/>'
};
const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
let status = {}, seriesCache = [], filter = 'all', q = '';

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), 4200);
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const title = s => s.title_english || s.title;
const fmtDate = ts => ts > 1 ? new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const ago = ts => { if (!ts) return 'never'; const m = Math.round((Date.now() / 1000 - ts) / 60); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
const poster = (c, t) => c ? `style="background-image:url('${esc(c)}')"` : '';
const epLabel = e => `S${String(e.season).padStart(2, '0')}E${String(e.season_offset + e.number).padStart(2, '0')}`;
const statusPill = e => ({ downloaded: ['ok', 'Downloaded'], queued: ['info', 'Downloading'], missing: [e.air_date && e.air_date * 1000 > Date.now() ? '' : 'bad', e.air_date && e.air_date * 1000 > Date.now() ? 'Upcoming' : 'Missing'] }[e.status] || ['', e.status]);

// ---------------------------------------------------------------- shell
const NAV = [['#/', 'grid', 'Series'], ['#/calendar', 'cal', 'Calendar'], ['#/wanted', 'alert', 'Wanted', 'missing', ''],
             ['#/activity', 'dl', 'Activity', 'downloading', 'info'], ['#/settings', 'cog', 'Settings']];
function renderShell() {
  const here = location.hash || '#/';
  $('#nav').innerHTML = NAV.map(([h, i, l, k, c]) => `<a href="${h}" class="${here === h || (h !== '#/' && here.startsWith(h)) || (h === '#/' && here.startsWith('#/series')) ? 'on' : ''}">${ic(i)}<span>${l}</span>${k && status[k] ? `<span class="count ${c}">${status[k]}</span>` : ''}</a>`).join('');
  $('#foot').innerHTML = `<div><span class="pulse ${status.running ? 'busy' : ''}"></span>${status.running ? 'Searching…' : 'Idle · last run ' + ago(status.last_cycle)}</div>
    <button class="btn" id="runBtn" ${status.running ? 'disabled' : ''}>${ic('refresh')} Run now</button>`;
  $('#runBtn').onclick = guard(async () => { await api('/api/run', 'POST'); toast('Search cycle started'); setTimeout(poll, 800); });
}
async function poll() { try { status = await api('/api/status'); renderShell(); } catch (e) {} }

// ---------------------------------------------------------------- series grid
async function pageSeries() {
  view.innerHTML = `<div class="top"><h1>Series</h1><span class="spacer"></span>
    <div class="search" style="width:min(260px,100%)"><span>${ic('search')}</span><input class="field" id="filterQ" placeholder="Filter your library" value="${esc(q)}" style="width:100%"></div>
    <button class="btn primary" id="addBtn">${ic('plus')} Add series</button></div>
    <div class="chips" id="chips" style="margin-bottom:20px"></div><div class="grid" id="grid">${'<div class="skel" style="aspect-ratio:2/3.6"></div>'.repeat(6)}</div>`;
  $('#addBtn').onclick = openAdd;
  $('#filterQ').oninput = e => { q = e.target.value; drawGrid(); };
  seriesCache = await api('/api/series');
  drawGrid();
}
function drawGrid() {
  const f = { all: () => true, airing: s => s.status === 'RELEASING', finished: s => s.status === 'FINISHED', missing: s => s.missing > 0, off: s => !s.monitored };
  $('#chips').innerHTML = [['all', 'All'], ['airing', 'Airing'], ['finished', 'Finished'], ['missing', 'Missing episodes'], ['off', 'Unmonitored']]
    .map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" data-k="${k}">${l}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.k; drawGrid(); });
  const list = seriesCache.filter(f[filter]).filter(s => !q || (title(s) + ' ' + s.title).toLowerCase().includes(q.toLowerCase()));
  $('#grid').innerHTML = list.length ? list.map(s => {
    const tot = s.total || Math.max(s.have + s.queued + s.missing, 1);
    return `<a class="card" href="#/series/${s.id}">
      <div class="poster" ${poster(s.cover)}>${s.cover ? '' : esc(title(s))}</div>
      <span class="badge">${esc(s.format)}</span>${!s.monitored ? '<span class="badge right off">Paused</span>' : s.missing ? `<span class="badge right">${s.missing} missing</span>` : ''}
      <div class="meta"><div class="t">${esc(title(s))}</div>
        <div class="s"><span>${s.have}/${s.total || '?'} eps</span><span>${s.season ? 'S' + String(s.season).padStart(2, '0') : 'Special'}</span></div>
        <div class="bar"><b style="width:${s.have / tot * 100}%"></b><i style="width:${s.queued / tot * 100}%"></i></div></div></a>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">${ic('empty')}<div>${seriesCache.length ? 'Nothing matches that filter.' : 'No series yet. Add your first anime to get started.'}</div></div>`;
}

// ---------------------------------------------------------------- add dialog
function openAdd() {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="dialog"><div class="head"><div class="search"><span>${ic('search')}</span>
    <input class="field" id="aq" placeholder="Search AniList (romaji, English or Japanese)" autofocus></div></div>
    <div class="list" id="ares"><div class="empty">Type a title and press Enter.</div></div></div>`;
  document.body.append(m);
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { m.remove(); document.removeEventListener('keydown', k); } });
  const inp = $('#aq', m); inp.focus();
  inp.onkeydown = guard(async e => {
    if (e.key !== 'Enter' || !inp.value.trim()) return;
    $('#ares', m).innerHTML = '<div class="empty">Searching…</div>';
    const r = await api('/api/search?q=' + encodeURIComponent(inp.value));
    $('#ares', m).innerHTML = r.length ? r.map(x => `<div class="res"><div class="thumb" ${poster(x.cover)}></div>
      <div class="i"><b>${esc(x.english || x.title)}</b><span class="sub">${esc(x.title)} · ${esc(x.format || '')} · ${x.total || '?'} eps · ${x.year || ''}</span></div>
      ${x.tracked ? '<span class="pill ok">Tracked</span>' : `<button class="btn primary" data-id="${x.id}">${ic('plus')} Add</button>`}</div>`).join('') : '<div class="empty">No results.</div>';
    m.querySelectorAll('button[data-id]').forEach(b => b.onclick = guard(async () => {
      b.disabled = true; b.textContent = 'Adding…';
      const { id } = await api('/api/series', 'POST', { anilist_id: +b.dataset.id });
      m.remove(); toast('Added'); location.hash = '#/series/' + id; poll();
    }));
  });
}

// ---------------------------------------------------------------- series detail
async function pageSeries1(id) {
  view.innerHTML = '<div class="skel" style="height:300px"></div>';
  const s = await api('/api/series/' + id);
  const aired = s.episodes.filter(e => e.air_date && e.air_date * 1000 <= Date.now());
  const absRange = s.total ? `${s.abs_offset + 1}–${s.abs_offset + s.total}` : `${s.abs_offset + 1}+`;
  view.innerHTML = `<p><a class="sub" href="#/">← Series</a></p>
  <div class="hero"><div class="bg" style="background-image:url('${esc(s.banner || s.cover || '')}')"></div><div class="in">
    <div class="p" ${poster(s.cover)}></div><div style="min-width:0">
      <h1>${esc(title(s))}</h1><div class="sub" style="color:#c9c9d6">${esc(s.title_native || s.title)}</div>
      <div class="tags"><span class="pill">${esc(s.format)}</span><span class="pill">${s.status === 'RELEASING' ? 'Airing' : esc(String(s.status || '').toLowerCase())}</span>
        <span class="pill">${s.season ? 'Season ' + s.season + (s.season_offset ? ' · from ep ' + (s.season_offset + 1) : '') : 'Special'}</span>
        <span class="pill">Absolute ${absRange}</span>${s.start_year ? `<span class="pill">${s.start_year}</span>` : ''}
        ${s.tvdb_id ? `<span class="pill">TVDB ${s.tvdb_id}</span>` : ''}${s.tmdb_id ? `<span class="pill">TMDB ${s.tmdb_id}</span>` : ''}</div>
      <div class="desc">${esc(s.description)}</div>
      <div class="actions"><button class="btn primary" id="srch">${ic('play')} Search now</button>
        <button class="btn" id="refr">${ic('refresh')} Refresh</button>
        <button class="btn" id="mon">${ic('eye')} ${s.monitored ? 'Monitored' : 'Unmonitored'}</button>
        <button class="btn" id="del">${ic('trash')} Remove</button></div></div></div></div>
  <div class="stats" style="margin-top:18px">
    <div class="panel stat"><div class="k">Downloaded</div><div class="v">${s.have} / ${s.total || '?'}</div></div>
    <div class="panel stat"><div class="k">Missing</div><div class="v" style="color:${s.missing ? 'var(--bad)' : 'inherit'}">${s.missing}</div></div>
    <div class="panel stat"><div class="k">Downloading</div><div class="v">${s.queued}</div></div>
    <div class="panel stat"><div class="k">Next episode</div><div class="v" style="font-size:18px;padding-top:5px">${s.next_air ? fmtDate(s.next_air) : '—'}</div></div></div>
  <h2>Episodes <span class="sub">(${aired.length} aired)</span></h2>
  <div class="panel"><div class="row head"><span>#</span><span>File</span><span class="air">Air date</span><span>Status</span></div>
  ${s.episodes.map(e => { const [c, l] = statusPill(e); const sn = { ...s, number: e.number };
    return `<div class="row"><span class="n">${e.number}</span>
      <span class="f">${e.file ? esc(e.file.split(/[\\/]/).pop()) : '<span class="sub">—</span>'}<small>${epLabel(sn)} · abs ${s.abs_offset + e.number}${e.res ? ' · ' + e.res + 'p' : ''}${e.grp ? ' · ' + esc(e.grp) : ''}</small></span>
      <span class="air sub">${fmtDate(e.air_date)}</span><span><span class="pill ${c}">${l}</span></span></div>`; }).join('')}</div>`;
  $('#srch').onclick = guard(async () => { await api('/api/run', 'POST'); toast('Search started'); setTimeout(poll, 800); });
  $('#refr').onclick = guard(async () => { await api(`/api/series/${id}/refresh`, 'POST'); toast('Refreshed'); pageSeries1(id); });
  $('#mon').onclick = guard(async () => { await api('/api/series/' + id, 'PATCH', { monitored: s.monitored ? 0 : 1 }); pageSeries1(id); });
  $('#del').onclick = guard(async () => {
    if (!confirm(`Stop tracking “${title(s)}”? Files already in your library are kept.`)) return;
    await api('/api/series/' + id, 'DELETE'); toast('Removed'); location.hash = '#/'; poll();
  });
}

// ---------------------------------------------------------------- calendar / wanted / activity
const epRow = e => `<div class="row wide"><div class="thumb" ${poster(e.cover)}></div>
  <span class="f"><a href="#/series/${e.series_id}"><b>${esc(e.title_english || e.title)}</b></a><small>${epLabel(e)} · ep ${e.number} · abs ${e.abs_offset + e.number}</small></span>
  <span class="air sub">${e.air_date > 1 ? fmtDate(e.air_date) + ' ' + (e.air_date > 86400 ? fmtTime(e.air_date) : '') : ''}</span>
  <span><span class="pill ${statusPill(e)[0]}">${statusPill(e)[1]}</span></span></div>`;

async function pageCalendar() {
  view.innerHTML = '<div class="top"><h1>Calendar</h1><span class="sub">Next 45 days</span></div><div id="cal"></div>';
  const eps = await api('/api/upcoming');
  const days = {};
  eps.forEach(e => (days[new Date(e.air_date * 1000).toDateString()] ||= []).push(e));
  const k = Object.keys(days);
  $('#cal').innerHTML = k.length ? k.map(d => {
    const dt = new Date(d), today = d === new Date().toDateString();
    return `<div class="day">${today ? 'Today' : dt.toLocaleDateString(undefined, { weekday: 'long' })} <small>${dt.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}</small></div>
      <div class="panel">${days[d].map(epRow).join('')}</div>`;
  }).join('') : `<div class="panel empty">${ic('cal')}<div>No upcoming episodes for the series you monitor.</div></div>`;
}
async function pageWanted() {
  view.innerHTML = `<div class="top"><h1>Wanted</h1><span class="sub">Aired episodes you don’t have yet</span><span class="spacer"></span>
    <button class="btn primary" id="all">${ic('play')} Search all</button></div><div id="w"></div>`;
  $('#all').onclick = guard(async () => { await api('/api/run', 'POST'); toast('Search started'); setTimeout(poll, 800); });
  const eps = await api('/api/wanted');
  $('#w').innerHTML = eps.length ? `<div class="panel">${eps.map(epRow).join('')}</div>` : `<div class="panel empty">${ic('alert')}<div>Nothing missing. You’re all caught up.</div></div>`;
}
async function pageActivity() {
  view.innerHTML = '<div class="top"><h1>Activity</h1></div><div id="a"></div>';
  const ds = await api('/api/downloads');
  const cls = { queued: 'info', downloading: 'info', imported: 'ok', failed: 'bad' };
  $('#a').innerHTML = ds.length ? `<div class="panel">${ds.map(d => { const eps = JSON.parse(d.episodes);
    return `<div class="row wide"><div class="thumb" ${poster(d.cover)}></div>
      <span class="f"><b>${esc(d.title)}</b><small>${esc(d.grp || '')} ${d.res ? '· ' + d.res + 'p ' : ''}· eps ${eps.length > 1 ? eps[0] + '–' + eps[eps.length - 1] : eps[0]} · ${new Date(d.added * 1000).toLocaleString()}</small></span>
      <span class="air sub">score ${d.score}</span><span><span class="pill ${cls[d.status] || ''}">${esc(d.status)}</span></span></div>`; }).join('')}</div>`
    : `<div class="panel empty">${ic('dl')}<div>No downloads yet.</div></div>`;
}

// ---------------------------------------------------------------- settings
async function pageSettings() {
  await poll(); const c = status.config, p = status.providers;
  const on = b => `<span class="pill ${b ? 'ok' : ''}">${b ? 'Configured' : 'Not set'}</span>`;
  view.innerHTML = `<div class="top"><h1>Settings</h1><span class="sub">Read-only. Edit <code>config.json</code> or environment variables, then restart.</span></div>
  <div class="stats">
    <div class="panel stat"><div class="k">Prowlarr</div><div class="v">${on(p.prowlarr)}</div></div>
    <div class="panel stat"><div class="k">TVDB</div><div class="v">${on(p.tvdb)}</div></div>
    <div class="panel stat"><div class="k">TMDB</div><div class="v">${on(p.tmdb)}</div></div>
    <div class="panel stat"><div class="k">Indexer feeds</div><div class="v">${status.indexers}</div></div></div>
  <h2>General</h2><div class="panel">
    ${[['Season numbering source', status.season_source], ['Check interval', c.interval_minutes + ' min'], ['Library', c.library], ['Import mode', c.import_mode],
       ['File naming', c.naming], ['Web listen', c.listen.join(':')]].map(([k, v]) => `<div class="kv"><span class="k">${k}</span><code>${esc(v)}</code></div>`).join('')}</div>
  <h2>Download client</h2><div class="panel">
    ${[['qBittorrent URL', c.qbittorrent.url], ['Category', c.qbittorrent.category], ['Save path', c.qbittorrent.save_path || '(client default)'], ['Username', c.qbittorrent.username], ['Password', c.qbittorrent.password || '—']]
      .map(([k, v]) => `<div class="kv"><span class="k">${k}</span><code>${esc(v)}</code></div>`).join('')}</div>
  <h2>Default quality profile</h2><div class="panel">
    ${Object.entries(c.default_profile).map(([k, v]) => `<div class="kv"><span class="k">${esc(k.replace(/_/g, ' '))}</span><code>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</code></div>`).join('')}</div>`;
}

// ---------------------------------------------------------------- router
const guardedRoute = fn => fn().catch(e => { view.innerHTML = `<div class="panel empty">${ic('alert')}<div>${esc(e.message)}</div></div>`; });
function route() {
  const h = location.hash || '#/', m = h.match(/^#\/series\/(\d+)/);
  renderShell(); scrollTo(0, 0);
  guardedRoute(() => m ? pageSeries1(m[1]) : h === '#/calendar' ? pageCalendar() : h === '#/wanted' ? pageWanted()
    : h === '#/activity' ? pageActivity() : h === '#/settings' ? pageSettings() : pageSeries());
}
addEventListener('hashchange', route);
poll().then(route); setInterval(poll, 10000);
</script>
</body>
</html>
