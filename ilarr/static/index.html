<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ilarr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M11 9v14M16 9v14M21 9l-2 14' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Tokens: zinc neutrals + one accent, shadcn-style. */
:root {
  --bg: #fafafa; --card: #ffffff; --muted-bg: #f4f4f5; --hover: #f4f4f5; --border: #e4e4e7;
  --fg: #09090b; --muted: #71717a; --primary: #6d4aff; --primary-fg: #ffffff;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb; --radius: 8px;
  --shadow: 0 1px 2px rgba(0,0,0,.05); --pop: 0 16px 48px rgba(0,0,0,.18);
}
:root[data-resolved="dark"] {
  --bg: #09090b; --card: #111113; --muted-bg: #18181b; --hover: #1c1c20; --border: #27272a;
  --fg: #fafafa; --muted: #a1a1aa; --primary: #8b6dff; --primary-fg: #0b0b0e;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
  --shadow: none; --pop: 0 16px 48px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: color-mix(in srgb, var(--primary) 30%, transparent); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
code, kbd { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--muted-bg); }

/* shell */
.app { display: grid; grid-template-columns: var(--sw, 224px) 1fr; height: 100vh; transition: grid-template-columns .15s; }
.app.collapsed { --sw: 56px; }
.side { border-right: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand i { width: 24px; height: 24px; border-radius: 7px; background: var(--primary); display: grid; place-items: center; flex: none; }
.brand i svg { width: 14px; stroke: var(--primary-fg); }
.nav a { display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 9px; border-radius: 7px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.nav a svg, .ibtn svg, .btn svg { width: 16px; height: 16px; flex: none; }
.nav a:hover { background: var(--hover); color: var(--fg); }
.nav a.on { background: var(--muted-bg); color: var(--fg); }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; }
.nav .count.info { background: var(--info); }
.collapsed .nav a span, .collapsed .brand span, .collapsed .foot .txt { display: none; }
.collapsed .nav a { position: relative; }
.collapsed .nav .count { display: inline; position: absolute; top: 2px; right: 2px; margin: 0; font-size: 9px; padding: 0 4px; }
.foot { margin-top: auto; display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
.foot .st { display: flex; align-items: center; gap: 8px; padding: 6px 9px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.busy { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

.content { display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-bottom: 1px solid var(--border); background: var(--card); flex: none; }
.bar h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb { color: var(--muted); } .crumb a:hover { color: var(--fg); }
.spacer { flex: 1; }
#palBtn2 { display: none; }
.page { flex: 1; overflow: auto; padding: 18px; }
.wrap { max-width: 1500px; margin: 0 auto; }

/* controls */
.btn, .ibtn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--border); background: var(--card);
  border-radius: var(--radius); font-weight: 500; box-shadow: var(--shadow); white-space: nowrap; }
.ibtn { width: 32px; padding: 0; justify-content: center; flex: none; }
.btn:hover, .ibtn:hover { background: var(--hover); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.input { height: 32px; width: 100%; padding: 0 10px 0 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
.input.plain { padding-left: 10px; }
.input::placeholder { color: var(--muted); }
.sw { position: relative; } .sw svg { position: absolute; left: 10px; top: 8px; width: 16px; color: var(--muted); pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); background: var(--muted-bg); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 6px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; }
.seg button svg { width: 15px; height: 15px; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .sw { width: 260px; max-width: 100%; }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--border); color: var(--muted); background: transparent; white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.badge.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 35%, transparent); background: color-mix(in srgb, var(--info) 10%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }

/* table */
.table { border: 1px solid var(--border); border-radius: 10px; background: var(--card); overflow: auto; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 0 12px; height: 36px; border-bottom: 1px solid var(--border);
  background: var(--card); position: sticky; top: 0; z-index: 1; white-space: nowrap; user-select: none; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--fg); }
th .ar { margin-left: 4px; color: var(--fg); }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr[data-go] { cursor: pointer; } tbody tr:hover td { background: var(--hover); }
tbody tr.sel td { background: color-mix(in srgb, var(--primary) 9%, transparent); }
td.chk, th.chk { width: 38px; padding-right: 0; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.tt { display: flex; align-items: center; gap: 11px; min-width: 200px; max-width: 460px; }
.thumb { width: 30px; aspect-ratio: 2/3; border-radius: 4px; background: var(--muted-bg) center/cover; flex: none; border: 1px solid var(--border); }
.tt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.muted { color: var(--muted); }
.tt small { display: block; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.prog { display: flex; align-items: center; gap: 9px; min-width: 130px; }
.prog .b { flex: 1; height: 6px; border-radius: 6px; background: var(--muted-bg); overflow: hidden; display: flex; border: 1px solid var(--border); }
.prog .b i { background: var(--ok); } .prog .b s { background: var(--info); }
.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 12px; border: 1px solid color-mix(in srgb, var(--primary) 40%, var(--border)); background: color-mix(in srgb, var(--primary) 8%, var(--card)); border-radius: var(--radius); flex-wrap: wrap; }

/* poster grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card { position: relative; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); transition: border-color .12s, transform .12s; display: block; }
.card:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); transform: translateY(-2px); }
.poster { aspect-ratio: 2/3; background: linear-gradient(145deg, var(--muted-bg), var(--border)) center/cover; display: grid; place-items: center; text-align: center; padding: 8px; color: var(--muted); font-size: 12px; }
.card .m { padding: 9px 10px 10px; } .card .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.card .s { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 4px 0 7px; }
.card .tag { position: absolute; top: 7px; left: 7px; } .card .tag.r { left: auto; right: 7px; }
.card .badge { background: rgba(9,9,11,.75); color: #fff; border-color: transparent; backdrop-filter: blur(6px); }
.card .badge.bad { background: var(--bad); }

/* series page */
.head { display: flex; gap: 16px; align-items: flex-start; padding-bottom: 16px; }
.head .p { width: 84px; aspect-ratio: 2/3; border-radius: 8px; background: var(--muted-bg) center/cover; border: 1px solid var(--border); flex: none; }
.head h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
.head .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.head .desc { color: var(--muted); max-width: 90ch; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tabs button { border: 0; background: transparent; padding: 9px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-color: var(--primary); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 12px 14px; }
.stat .k { color: var(--muted); font-size: 12px; } .stat .v { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
.panel { border: 1px solid var(--border); border-radius: 10px; background: var(--card); overflow: hidden; margin-bottom: 14px; }
.panel h3 { margin: 0; padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
.kv { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--border); }
.kv:last-child { border: 0; } .kv .k { color: var(--muted); }
.kv code { word-break: break-all; }
.fields { display: flex; gap: 12px; flex-wrap: wrap; padding: 14px 16px; align-items: flex-end; }
.fields label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; } .fields .input { width: 150px; }
.help { padding: 0 16px 14px; color: var(--muted); font-size: 12.5px; }
.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.empty svg { width: 34px; height: 34px; margin-bottom: 8px; opacity: .6; }
.day { padding: 14px 4px 6px; font-weight: 600; } .day small { color: var(--muted); font-weight: 400; margin-left: 6px; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); display: grid; place-items: start center; padding: 12vh 16px; z-index: 50; }
.dialog { width: min(600px, 100%); max-height: 70vh; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--pop); overflow: hidden; }
.dialog .in { padding: 10px; border-bottom: 1px solid var(--border); } .dialog .in .input { border: 0; box-shadow: none; height: 36px; background: transparent; }
.dialog .in .sw svg { top: 10px; }
.list { overflow: auto; padding: 6px; }
.item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.item.on, .item:hover { background: var(--muted-bg); }
.item .i { flex: 1; min-width: 0; } .item .i b { display: block; font-weight: 550; } .item .i small { color: var(--muted); }
.item > svg { width: 16px; color: var(--muted); }
.group { padding: 8px 10px 4px; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--card); border: 1px solid var(--border); box-shadow: var(--pop); padding: 10px 14px; border-radius: 9px; max-width: 360px; }
.toast.err { border-color: var(--bad); color: var(--bad); }
.skel { background: linear-gradient(90deg, var(--muted-bg), var(--border), var(--muted-bg)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
@keyframes sh { to { background-position: -200% 0; } }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; --sw: 0px; } .app.collapsed { --sw: 0px; }
  .side { position: fixed; bottom: 0; left: 0; right: 0; height: 58px; flex-direction: row; border-right: 0; border-top: 1px solid var(--border); z-index: 20; padding: 4px; }
  .brand, .foot { display: none; } .nav { display: flex; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 1px; height: 50px; justify-content: center; font-size: 10.5px; position: relative; }
  .nav .count, .collapsed .nav .count { position: absolute; top: 2px; right: 2px; margin: 0; font-size: 9px; }
  .collapsed .nav a span { display: inline; }
  .content { padding-bottom: 58px; height: 100vh; } .page { padding: 12px; } .bar { padding: 0 12px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hide-m { display: none; } #collapseBtn, .kbdhint { display: none; } #palBtn2 { display: inline-flex; }
  .kv { grid-template-columns: 1fr; gap: 3px; } .head { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M7 4v16M12 4v16M17 4l-2 16"/></svg></i><span>ilarr</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="content">
    <header class="bar" id="bar"></header>
    <div class="page" id="page"><div class="wrap" id="view"></div></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
const ICONS = {
  grid: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
  dl: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', refresh: '<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',
  play: '<path d="M7 4l13 8-13 8z"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M3 3l18 18M10.6 6.1A9 9 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3.1 3.7M6.6 7.6A17 17 0 0 0 2 12s4 7 10 7a9 9 0 0 0 4-1"/>',
  sidebar: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon: '<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>', empty: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 12h8"/>',
  check: '<path d="m5 12 5 5 9-10"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const view = $('#view');
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('ilarr.' + k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem('ilarr.' + k, JSON.stringify(v)); } catch {} } };
let status = {}, series = [], sel = new Set();
const ui = { view: store.get('view', 'table'), filter: 'all', q: '', sort: store.get('sort', { k: 'title', d: 1 }), theme: store.get('theme', 'system'), collapsed: store.get('collapsed', false) };

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, err) { const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; $('#toasts').append(el); setTimeout(() => el.remove(), 4000); }
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const name = s => s.title_english || s.title;
const fd = ts => ts > 1 ? new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const ft = ts => new Date(ts * 1000).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const ago = ts => { if (!ts) return 'never'; const m = Math.round((Date.now() / 1000 - ts) / 60); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
const bg = c => c ? `style="background-image:url('${esc(c)}')"` : '';
const sNum = s => s.season ? 'S' + String(s.season).padStart(2, '0') : 'Sp';
const absR = s => s.total ? `${s.abs_offset + 1}–${s.abs_offset + s.total}` : `${s.abs_offset + 1}+`;
const epl = e => `S${String(e.season).padStart(2, '0')}E${String(e.season_offset + e.number).padStart(2, '0')}`;
const upcoming = e => e.air_date && e.air_date * 1000 > Date.now();
const epBadge = e => e.status === 'downloaded' ? ['ok', 'Downloaded'] : e.status === 'queued' ? ['info', 'Downloading'] : upcoming(e) || !e.air_date ? ['', 'Upcoming'] : ['bad', 'Missing'];
const stBadge = s => s.status === 'RELEASING' ? ['info', 'Airing'] : s.status === 'FINISHED' ? ['', 'Finished'] : ['', String(s.status || '—').toLowerCase()];

/* ---------------------------------------------------------------- theme + shell */
function applyTheme() {
  const dark = ui.theme === 'dark' || (ui.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.resolved = dark ? 'dark' : 'light';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
const cycleTheme = () => { ui.theme = { system: 'light', light: 'dark', dark: 'system' }[ui.theme]; store.set('theme', ui.theme); applyTheme(); renderBar(); toast('Theme: ' + ui.theme); };
const NAV = [['#/', 'grid', 'Series'], ['#/calendar', 'cal', 'Calendar'], ['#/wanted', 'alert', 'Wanted', 'missing', ''], ['#/activity', 'dl', 'Activity', 'downloading', 'info'], ['#/settings', 'cog', 'Settings']];
const here = () => location.hash || '#/';
function renderNav() {
  $('#app').classList.toggle('collapsed', ui.collapsed);
  $('#nav').innerHTML = NAV.map(([h, i, l, k, c]) => {
    const on = h === '#/' ? here() === '#/' || here().startsWith('#/series') : here().startsWith(h);
    return `<a href="${h}" title="${l}" class="${on ? 'on' : ''}">${ic(i)}<span>${l}</span>${k && status[k] ? `<span class="count ${c}">${status[k]}</span>` : ''}</a>`;
  }).join('');

/* ---------------------------------------------------------------- series list */
const SORTS = {
  title: s => name(s).toLowerCase(), fmt: s => s.format, season: s => s.season * 1000 + s.season_offset, abs: s => s.abs_offset,
  progress: s => s.have / (s.total || Math.max(s.have + s.queued + s.missing, 1)), missing: s => s.missing, next: s => s.next_air || 9e12, status: s => s.status || ''
};
const FILTERS = { all: () => true, airing: s => s.status === 'RELEASING', finished: s => s.status === 'FINISHED', missing: s => s.missing > 0, paused: s => !s.monitored };
function visible() {
  const q = ui.q.toLowerCase(), f = SORTS[ui.sort.k] || SORTS.title;
  return series.filter(FILTERS[ui.filter]).filter(s => !q || (name(s) + ' ' + s.title + ' ' + (s.title_native || '')).toLowerCase().includes(q))

}
function draw() {
  $('#seg').innerHTML = [['all', 'All'], ['airing', 'Airing'], ['finished', 'Finished'], ['missing', 'Missing'], ['paused', 'Paused']]
    .map(([k, l]) => `<button data-k="${k}" class="${ui.filter === k ? 'on' : ''}">${l}</button>`).join('');

    <button class="btn sm" data-a="clear">Clear</button></div>` : '';
  $$('#list tr[data-go]').forEach(r => r.onclick = e => { if (!e.target.closest('.chk')) location.hash = '#/series/' + r.dataset.go; });
  $$('#list input[data-id]').forEach(c => c.onchange = () => { c.checked ? sel.add(+c.dataset.id) : sel.delete(+c.dataset.id); draw(); });

async function bulk(e) {

}
function tableHtml(list) {

function gridHtml(list) {

/* ---------------------------------------------------------------- add dialog + command palette */
function overlay(html) {
  const o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = html; document.body.append(o);
  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => { o.remove(); document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey); o.onmousedown = e => { if (e.target === o) close(); };
  return { o, close };
}
function openAdd() {
  const { o, close } = overlay(`<div class="dialog"><div class="in"><div class="sw">${ic('search')}<input class="input" id="aq" placeholder="Search AniList — romaji, English or Japanese, then Enter"></div></div>
    <div class="list" id="ares"><div class="empty">Type a title and press Enter.</div></div></div>`);
  const inp = $('#aq', o); inp.focus();
  inp.onkeydown = guard(async e => {
    if (e.key !== 'Enter' || !inp.value.trim()) return;
    $('#ares', o).innerHTML = '<div class="empty">Searching…</div>';
    const r = await api('/api/search?q=' + encodeURIComponent(inp.value));
    $('#ares', o).innerHTML = r.length ? r.map(x => `<div class="item"><div class="thumb" ${bg(x.cover)}></div><div class="i"><b>${esc(x.english || x.title)}</b>
      <small>${esc(x.title)} · ${esc(x.format || '')} · ${x.total || '?'} eps · ${x.year || ''}</small></div>
      ${x.tracked ? '<span class="badge ok">Tracked</span>' : `<button class="btn sm primary" data-id="${x.id}">${ic('plus')} Add</button>`}</div>`).join('') : '<div class="empty">No results.</div>';
    $$('button[data-id]', o).forEach(b => b.onclick = guard(async () => {
      b.disabled = true; b.textContent = 'Adding…';
      const { id } = await api('/api/series', 'POST', { anilist_id: +b.dataset.id });

}
async function openPalette() {
  if (!series.length) series = await api('/api/series').catch(() => []);
  const cmds = [...NAV.map(([h, i, l]) => ({ g: 'Go to', l, i, run: () => location.hash = h })),
    { g: 'Actions', l: 'Add series…', i: 'plus', run: openAdd }, { g: 'Actions', l: 'Run search cycle now', i: 'play', run: () => api('/api/run', 'POST').then(() => toast('Search started')) },
    { g: 'Actions', l: 'Cycle theme', i: 'sun', run: cycleTheme }, { g: 'Actions', l: 'Toggle table / poster view', i: 'grid', run: () => { ui.view = ui.view === 'table' ? 'grid' : 'table'; store.set('view', ui.view); location.hash = '#/'; route(); } },
    ...series.map(s => ({ g: 'Series', l: name(s), sub: s.title, c: s.cover || '', run: () => location.hash = '#/series/' + s.id }))];
  const { o, close } = overlay(`<div class="dialog"><div class="in"><div class="sw">${ic('search')}<input class="input" id="pq" placeholder="Type a command or series name…"></div></div><div class="list" id="pl"></div></div>`);
  let idx = 0, shown = [];
  const render = () => {
    const q = $('#pq', o).value.toLowerCase(); shown = cmds.filter(c => !q || (c.l + ' ' + (c.sub || '')).toLowerCase().includes(q)).slice(0, 40); idx = Math.min(idx, Math.max(shown.length - 1, 0));
    let last = ''; $('#pl', o).innerHTML = shown.map((c, i) => (c.g !== last ? `<div class="group">${last = c.g}</div>` : '') +
      `<div class="item ${i === idx ? 'on' : ''}" data-i="${i}">${c.c !== undefined ? `<div class="thumb" ${bg(c.c)}></div>` : ic(c.i)}<div class="i"><b>${esc(c.l)}</b>${c.sub && c.sub !== c.l ? `<small>${esc(c.sub)}</small>` : ''}</div></div>`).join('') || '<div class="empty">No matches.</div>';
    $$('.item', o).forEach(el => { el.onclick = () => { close(); shown[+el.dataset.i].run(); }; });
    $('.item.on', o)?.scrollIntoView({ block: 'nearest' });
  };
  $('#pq', o).oninput = () => { idx = 0; render(); };
  $('#pq', o).onkeydown = e => {
    if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, shown.length - 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); render(); e.preventDefault(); }
    else if (e.key === 'Enter' && shown[idx]) { close(); shown[idx].run(); }
  };
  render(); $('#pq', o).focus();
}
addEventListener('keydown', e => {

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!$('.overlay')) openPalette(); }

    ${ds.map(x => { const eps = JSON.parse(x.episodes); return `<tr><td style="white-space:normal;max-width:420px" title="${esc(x.title)}">${esc(x.title)}</td>
    <td><div class="tt"><div class="thumb" ${bg(x.cover)}></div><span>${esc(x.series_title || '')}</span></div></td>
    <td class="hide-m num">${eps.length > 1 ? eps[0] + '–' + eps[eps.length - 1] : eps[0]}</td><td class="hide-m muted">${x.res ? x.res + 'p' : ''} ${esc(x.grp || '')}</td>
    <td class="hide-m muted">${new Date(x.added * 1000).toLocaleString()}</td><td><span class="badge ${cls[x.status] || ''}">${esc(x.status)}</span></td></tr>`; }).join('')}</tbody></table></div>`
    : `<div class="table"><div class="empty">${ic('dl')}<div>No downloads yet.</div></div></div>`;
}
async function pageSettings() {
  crumb = [['Settings']]; await poll(); renderBar(); const c = status.config, p = status.providers;
  const on = b => `<span class="badge ${b ? 'ok' : ''}">${b ? 'Configured' : 'Not set'}</span>`;
  const panel = (h, rows) => `<div class="panel"><h3>${h}</h3>${rows.map(([k, v]) => `<div class="kv"><span class="k">${esc(k)}</span><code>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</code></div>`).join('')}</div>`;
  view.innerHTML = `<div class="stats"><div class="stat"><div class="k">Prowlarr</div><div class="v">${on(p.prowlarr)}</div></div><div class="stat"><div class="k">TVDB</div><div class="v">${on(p.tvdb)}</div></div>
    <div class="stat"><div class="k">TMDB</div><div class="v">${on(p.tmdb)}</div></div><div class="stat"><div class="k">Indexer feeds</div><div class="v num">${status.indexers}</div></div></div>
    <p class="muted">Read-only. Edit <code>config.json</code> or the <code>ILARR_*</code> environment variables, then restart.</p>
    ${panel('General', [['Season numbering source', status.season_source], ['Check interval', c.interval_minutes + ' min'], ['Library', c.library], ['Import mode', c.import_mode], ['File naming', c.naming], ['Web listen', c.listen.join(':')]])}
    ${panel('Download client', [['qBittorrent URL', c.qbittorrent.url], ['Category', c.qbittorrent.category], ['Save path', c.qbittorrent.save_path || '(client default)'], ['Username', c.qbittorrent.username], ['Password', c.qbittorrent.password || '—']])}
    ${panel('Default quality profile', Object.entries(c.default_profile).map(([k, v]) => [k.replace(/_/g, ' '), v]))}`;
}

/* ---------------------------------------------------------------- router */
function route() {
  const h = here(), m = h.match(/^#\/series\/(\d+)/);
  renderNav(); $('#page').scrollTo(0, 0);
  const run = m ? () => pageDetail(m[1]) : h === '#/calendar' ? pageCalendar : h === '#/wanted' ? pageWanted : h === '#/activity' ? pageActivity : h === '#/settings' ? pageSettings : pageSeries;
  run().catch(e => { view.innerHTML = `<div class="table"><div class="empty">${ic('alert')}<div>${esc(e.message)}</div></div></div>`; });
}
addEventListener('hashchange', route);
applyTheme(); renderBar(); poll().then(route); setInterval(poll, 10000);
</script>
</body>
</html>
