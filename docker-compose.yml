# ilarr only. qBittorrent and Prowlarr run elsewhere; point to them in .env (see .env.example).
services:
  ilarr:
    build: .
    container_name: ilarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the defaults reach services on the Docker host
    environment:
      ILARR_QBIT_URL: ${QBIT_URL:-http://host.docker.internal:8080}
      ILARR_QBIT_USER: ${QBIT_USER:-admin}
      ILARR_QBIT_PASS: ${QBIT_PASS:-adminadmin}
      # Folder where qBittorrent saves, as seen from *inside this container* (mounted below)
      ILARR_QBIT_SAVE_PATH: /downloads
      ILARR_PROWLARR_URL: ${PROWLARR_URL:-http://host.docker.internal:9696}
      ILARR_PROWLARR_KEY: ${PROWLARR_API_KEY:-}
      ILARR_TMDB_KEY: ${TMDB_API_KEY:-}
      ILARR_TVDB_KEY: ${TVDB_API_KEY:-}
      ILARR_SEASON_SOURCE: ${SEASON_SOURCE:-anilist}   # anilist | tvdb | tmdb
    volumes:
      - ./config:/config
      - ${LIBRARY_DIR:-./library}:/library
      - ${DOWNLOADS_DIR:-./downloads}:/downloads   # the same host folder qBittorrent downloads to
